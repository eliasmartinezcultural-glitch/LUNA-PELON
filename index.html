<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Pelón — Prototipo 0.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu" class="screen">
    <section class="title-card">
      <p class="eyebrow">OCARINA PRODUCCIONES</p>
      <h1>LUNA PELÓN</h1>
      <p>Una aventura comienza aquí.</p>
      <button id="playButton">JUGAR</button>
    </section>
  </main>

  <main id="game" class="screen hidden">
    <header class="hud">
      <strong>LUNA PELÓN</strong>
      <span>Prototipo 0.1</span>
    </header>
    <section id="world" aria-label="Mundo del juego">
      <div class="ground"></div>
      <div class="house house-a"></div>
      <div class="house house-b"></div>
      <div class="tree tree-a"></div>
      <div class="tree tree-b"></div>
      <div id="player" aria-label="Personaje"></div>
      <div class="hint">WASD / FLECHAS para caminar</div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
